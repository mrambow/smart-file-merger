name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartFileMerger.sln

      - name: Build solution
        run: dotnet build SmartFileMerger.sln --no-restore --configuration Release

      - name: Run unit & integration tests
        run: dotnet test SmartFileMerger.sln --no-build --configuration Release --verbosity normal

      - name: Run release script tests
        shell: pwsh
        run: pwsh -File ./tests/scripts/resolve-release-version.Tests.ps1
