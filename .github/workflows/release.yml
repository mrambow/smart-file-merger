name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release (e.g. v1.0.0)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        shell: pwsh
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          $commitMsg = $(git log -1 --pretty=%B)
          pwsh -File ./scripts/resolve-release-version.ps1 `
            -ExplicitTagName "$env:INPUT_TAG_NAME" `
            -CommitMessage "$commitMsg" `
            -OutputFile "$env:GITHUB_OUTPUT"

      - name: Setup .NET SDK
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        if: steps.version.outputs.skip != 'true'
        run: dotnet test --configuration Release

      - name: Publish self-contained executable
        if: steps.version.outputs.skip != 'true'
        run: dotnet publish src/SmartFileMerger/SmartFileMerger.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ steps.version.outputs.version }} -o ./publish

      - name: Generate SHA256 checksum
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./publish/SmartFileMerger.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SmartFileMerger.exe" | Out-File -FilePath ./publish/SmartFileMerger.exe.sha256 -Encoding ascii

      - name: Create Git Tag
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $existingTag = $(git tag -l $env:TAG)
          if (-not $existingTag) {
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a $env:TAG -m "Release $env:TAG"
              git push origin $env:TAG
          }

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: |
            ./publish/SmartFileMerger.exe
            ./publish/SmartFileMerger.exe.sha256
          generate_release_notes: true
