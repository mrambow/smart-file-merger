name: Claude PR Review Gate

on:
  pull_request_target:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      github.event.label.name == 'review' &&
      (github.actor == 'mrambow' || github.event.sender.login == 'mrambow')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Claude PR Review Gate
        uses: mrambow/claude-pr-gate@2f32134bddd9e61267b742f7259e656cf629508b # v1.2.0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          diff-excludes: |
            :!package-lock.json
            :!pnpm-lock.yaml
            :!yarn.lock
            :!*.min.*
            :!*.snap
            :!*.svg
            :!**/bin/**
            :!**/obj/**
